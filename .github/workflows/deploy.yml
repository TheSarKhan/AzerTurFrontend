name: Deploy
# Production deploys on every push to main, and manually from the Actions tab.
# The image is built in parallel with CI; nothing is shipped to the server until
# CI has succeeded for the same commit (see "Wait for CI").
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHA: ${{ github.sha }}
      IMAGE: aztrip-web
      SERVICE: web
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
      - name: Wait for CI
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --limit 1 \
              --json status,conclusion \
              --jq '.[0] | if . == null or .status != "completed" then "pending" else .conclusion end')
            case "$result" in
              success) echo "CI passed for $SHA"; exit 0 ;;
              pending) sleep 4 ;;
              *) echo "CI finished with '$result' for $SHA; not deploying."; exit 1 ;;
            esac
          done
          echo "Timed out waiting for CI"; exit 1
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship image to server
        run: |
          docker save "$IMAGE:$SHA" "$IMAGE:latest" | gzip \
            | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'gunzip | docker load'
      - name: Restart service and wait until healthy
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/aztrip
          docker compose up -d --no-deps --force-recreate web
          for i in $(seq 1 36); do
            if curl -fsS -o /dev/null http://127.0.0.1:8102/; then echo "web is healthy"; break; fi
            if [ "$i" = 36 ]; then docker compose logs --tail 60 web; exit 1; fi
            sleep 5
          done
          # Make sure the running container really uses the image we just shipped.
          running=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")
          shipped=$(docker image inspect --format '{{.Id}}' aztrip-web:latest)
          echo "running image: $running"
          echo "shipped image: $shipped"
          docker compose ps web
          if [ "$running" != "$shipped" ]; then echo "Running container is not using the shipped image"; exit 1; fi
          docker images aztrip-web --format '{{.Repository}}:{{.Tag}}' | grep -v ':latest$' | tail -n +4 | xargs -r docker rmi || true
          REMOTE
